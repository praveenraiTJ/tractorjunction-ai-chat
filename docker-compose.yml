version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: tractor-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: tractor_junction
      MYSQL_USER: tractor_user
      MYSQL_PASSWORD: tractor_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/config/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - tractor-network
    restart: unless-stopped

  # ChromaDB Vector Database
  chromadb:
    image: chromadb/chroma:latest
    container_name: tractor-chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8000
    networks:
      - tractor-network
    restart: unless-stopped

  # Redis Cache (Optional)
  redis:
    image: redis:7-alpine
    container_name: tractor-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - tractor-network
    restart: unless-stopped

  # Tractor Junction AI Chat Application
  app:
    build: .
    container_name: tractor-chat-app
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=tractor_junction
      - DB_USER=tractor_user
      - DB_PASSWORD=tractor_password
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - mysql
      - chromadb
      - redis
    volumes:
      - ./logs:/app/logs
      - ./cache:/app/cache
    networks:
      - tractor-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: tractor-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - tractor-network
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local
  chroma_data:
    driver: local
  redis_data:
    driver: local

networks:
  tractor-network:
    driver: bridge
